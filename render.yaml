services:
  # ─── Backend: FastAPI ───────────────────────────────────────────
  - type: web
    name: fix2runbook-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        value: sqlite:///./fix2runbook.db
      - key: LLM_API_KEY
        sync: false          # Set this manually in Render dashboard
      - key: GITHUB_TOKEN
        sync: false          # Set this manually in Render dashboard
      - key: CORS_ORIGINS
        value: '["*"]'
    healthCheckPath: /

  # ─── Frontend: React/Vite Static Site ───────────────────────────
  - type: web
    name: fix2runbook-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: fix2runbook-backend
          type: web
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
